[package]
name = "prism-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
prism-common = { path = "../prism-common" }
prism-capture = { path = "../prism-capture" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
xkbcommon = { version = "0.8", features = ["wayland"] }
zbus = "5"
blocking = "1"
md5 = "0.7"
# gnome-keyring prompter secret exchange (keyring_prompter.rs)
num-bigint = "0.4"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
# Sound page level meters (meters.rs)
pipewire = { version = "0.10", features = ["v0_3_34"] }
