# xdg-desktop-portal backends for a Prism session on MangoWM
# (~/.config/xdg-desktop-portal/mango-portals.conf; also used as niri-/hyprland-portals.conf).
# Prism (prism-ui) does screenshots, colour picking, screen sharing and the appearance settings
# (dark/light, accent colour; GTK adds its own keys after Prism's); GTK does the rest.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=prism
org.freedesktop.impl.portal.ScreenCast=prism
org.freedesktop.impl.portal.Settings=prism;gtk
org.freedesktop.impl.portal.Inhibit=none
