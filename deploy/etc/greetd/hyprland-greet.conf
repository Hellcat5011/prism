# Minimal Hyprland configuration for the greetd greeter session.
# greetd starts Hyprland with this file and Hyprland launches the Quickshell greeter.
# When the greeter finishes authenticating it calls `hyprctl dispatch exit`, which
# ends this session so greetd can start the user's selected session.
#
# Deliberately no keybinds: nobody can open terminals or spawn programs from the login screen.

monitor = ,preferred,auto,1

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_watchdog_warning = true
    disable_autoreload = true
}

animations {
    enabled = false
}

exec-once = qs -p /etc/greetd/quickshell-greeter

