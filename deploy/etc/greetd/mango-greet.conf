# Minimal MangoWM configuration for the greetd greeter session.
# greetd starts MangoWM with this file and MangoWM launches the Quickshell greeter.
# When the greeter finishes authenticating it calls `mmsg quit`, which ends this
# session so greetd can start the user's selected session.
#
# Deliberately no keybinds: nobody can open terminals or spawn programs from the login screen.

exec_once = qs -p /etc/greetd/quickshell-greeter

