# ─────────────────────────────────────────────────────────────────────────
# Xeon Shell — MangoWM configuration snippet
#
# Either paste the parts you want into ~/.config/mango/config.conf, or keep
# this file next to your config and source it with:
#
#     source = ~/.config/mango/xeon-shell-mango.conf
#
# Everything below is a suggestion; rebind freely. The shell is controlled by
# `qs -c xeon-shell-niri ipc call <target> <method>` (run
# `qs -c xeon-shell-niri ipc call help display` for the full list).
# ─────────────────────────────────────────────────────────────────────────

# Start the shell with MangoWM
exec_once = qs -c xeon-shell-niri

# ── Shell Keybindings ────────────────────────────────────────────────────
bind = SUPER, Space, spawn, qs -c xeon-shell-niri ipc call launcher toggle
bind = SUPER+SHIFT, Space, spawn, qs -c xeon-shell-niri ipc call search toggle
bind = SUPER+ALT, w, spawn, qs -c xeon-shell-niri ipc call wallpaper toggle
bind = SUPER+ALT, v, spawn, qs -c xeon-shell-niri ipc call clipboard toggle
bind = SUPER+ALT, e, spawn, qs -c xeon-shell-niri ipc call emoji toggle
bind = SUPER+ALT, c, spawn, qs -c xeon-shell-niri ipc call colorpicker toggle
bind = SUPER+ALT, n, spawn, qs -c xeon-shell-niri ipc call notif toggle
bind = SUPER+ALT, comma, spawn, qs -c xeon-shell-niri ipc call settings toggle
bind = SUPER+ALT, p, spawn, qs -c xeon-shell-niri ipc call power toggle
bind = SUPER+ALT, slash, spawn, qs -c xeon-shell-niri ipc call keybinds toggle
bind = SUPER+ALT, Delete, spawn, qs -c xeon-shell-niri ipc call lock lock

# ── Recovery ─────────────────────────────────────────────────────────────
# Restart Quickshell if it crashes while the session is locked.
bind = SUPER+SHIFT, Escape, spawn, killall qs; qs -c xeon-shell-niri

