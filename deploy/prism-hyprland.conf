# ─────────────────────────────────────────────────────────────────────────
# Prism (Rust) — Hyprland configuration snippet
#
# Source this file from ~/.config/hypr/hyprland.conf:
#     source = ~/.config/hypr/prism-hyprland.conf
# ─────────────────────────────────────────────────────────────────────────

# prismd is started by the systemd user unit (deploy/prismd.service); do not
# also exec-once it here (a second launcher orphaned a duplicate desktop layer).

# ── Blur Rules for Layer Surfaces ─────────────────────────────────────────
# Only card-sized surfaces are blurred. prism-scrim (full-screen dim),
# prism-desktop, prism-desktop-edit and prism-wallpaper must stay un-blurred.
layerrule = blur, namespace:^(prism-modal|prism-notification|prism-osd)$
layerrule = ignorealpha 0.01, namespace:^(prism-modal|prism-notification|prism-osd)$

# ── Shell Keybindings ────────────────────────────────────────────────────
bind = SUPER, Space, exec, prism-ctl launcher toggle
bind = SUPER SHIFT, Space, exec, prism-ctl search toggle
bind = SUPER ALT, W, exec, prism-ctl wallpaper toggle
bind = SUPER ALT, V, exec, prism-ctl clipboard toggle
bind = SUPER ALT, E, exec, prism-ctl emoji toggle
bind = SUPER ALT, C, exec, prism-ctl colorpicker toggle
bind = SUPER ALT, N, exec, prism-ctl notif toggle
bind = SUPER ALT, comma, exec, prism-ctl settings toggle
bind = SUPER ALT, P, exec, prism-ctl power toggle
bind = SUPER ALT, slash, exec, prism-ctl keybinds toggle
bind = SUPER ALT, Delete, exec, prism-ctl lock lock

# ── Hardware OSD ─────────────────────────────────────────────────────────
bind = , XF86AudioRaiseVolume, exec, prism-ctl osd volume +5
bind = , XF86AudioLowerVolume, exec, prism-ctl osd volume -5
bind = , XF86MonBrightnessUp, exec, prism-ctl osd brightness +5
bind = , XF86MonBrightnessDown, exec, prism-ctl osd brightness -5
