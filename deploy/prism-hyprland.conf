# ─────────────────────────────────────────────────────────────────────────
# Prism — Hyprland configuration snippet
#
# Either paste the parts you want into ~/.config/hypr/hyprland.conf, or keep
# this file next to your config and source it with:
#
#     source = ~/.config/hypr/prism-hyprland.conf
#
# Everything below is a suggestion; rebind freely. The shell is controlled by
# `qs -c prism ipc call <target> <method>` (run
# `qs -c prism ipc call help display` for the full list).
# ─────────────────────────────────────────────────────────────────────────

# Start the shell with Hyprland
exec-once = qs -c prism

# ── Shell Keybindings ────────────────────────────────────────────────────
bind = SUPER, Space, exec, qs -c prism ipc call launcher toggle
bind = SUPER SHIFT, Space, exec, qs -c prism ipc call search toggle
bind = SUPER ALT, W, exec, qs -c prism ipc call wallpaper toggle
bind = SUPER ALT, V, exec, qs -c prism ipc call clipboard toggle
bind = SUPER ALT, E, exec, qs -c prism ipc call emoji toggle
bind = SUPER ALT, C, exec, qs -c prism ipc call colorpicker toggle
bind = SUPER ALT, N, exec, qs -c prism ipc call notif toggle
bind = SUPER ALT, comma, exec, qs -c prism ipc call settings toggle
bind = SUPER ALT, P, exec, qs -c prism ipc call power toggle
bind = SUPER ALT, slash, exec, qs -c prism ipc call keybinds toggle
bind = SUPER ALT, Delete, exec, qs -c prism ipc call lock lock

# ── Recovery ─────────────────────────────────────────────────────────────
# Restart Quickshell if it crashes while the session is locked.
bindl = SUPER SHIFT, Escape, exec, killall qs; qs -c prism

