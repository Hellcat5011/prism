# ─────────────────────────────────────────────────────────────────────────
# Prism (Rust) — MangoWM configuration snippet
#
# Source this file from ~/.config/mango/config.conf:
#     source=~/.config/mango/prism-mango.conf      (or the path to this file)
#
# prismd is started by the systemd user unit (deploy/prismd.service).
# Do NOT also add `exec_once=prismd` here: a second launcher used to orphan a
# duplicate desktop layer.
#
# Controlled via `prism-ctl <target> <action>`
# ─────────────────────────────────────────────────────────────────────────

# ── Blur / animation rules for Prism layer surfaces ──────────────────────
# Prism layer rules. Mango applies EVERY matching layer_rule in order and each one
# overwrites all of its options (defaults are 0), so each Prism surface gets exactly
# one rule carrying all options. layer_name is a regex search, hence ^...$ anchors.
# Options need an explicit value (`no_blur:1`); a bare `no_blur` is silently ignored.
# Rules apply when a surface maps; config reload does not touch already-open surfaces.
#   prism-scrim         full-screen dim behind modal cards (and the card shadow, a
#                       subsurface of it): never blur
#   prism-desktop       desktop widgets (bottom layer, never blurred by Mango anyway)
#   prism-background    built-in wallpaper (background layer)
#   prism-desktop-edit  full-screen edit canvas: never blur
#   prism-wallpaper     carousel without a card background: never blur
#   prism-capture / prism-picker: full-screen frozen frame (screenshot overlay,
#                       colour picker): never blur or animate
#   prism-modal / prism-notification / prism-osd: card-sized, blurred
# no_animation: Prism animates its own surfaces (refresh-rate synced).
layer_rule=no_blur:1,no_animation:1,layer_name:^prism-scrim$
layer_rule=no_blur:1,no_animation:1,layer_name:^prism-desktop$
layer_rule=no_blur:1,no_animation:1,layer_name:^prism-desktop-edit$
layer_rule=no_blur:1,no_animation:1,layer_name:^prism-wallpaper$
layer_rule=no_blur:1,no_animation:1,layer_name:^prism-background$
layer_rule=no_blur:1,no_animation:1,layer_name:^prism-(capture|picker)$
layer_rule=no_animation:1,layer_name:^prism-modal$
layer_rule=no_animation:1,layer_name:^prism-notification$
layer_rule=no_animation:1,layer_name:^prism-osd$
# Blur toggled off in Prism settings: cards use "<name>-solid" namespaces.
layer_rule=no_blur:1,no_animation:1,layer_name:^prism-(modal|notification|osd)-solid$

# ── Shell Keybindings ────────────────────────────────────────────────────
bind=SUPER,Space,spawn,prism-ctl launcher toggle
bind=SUPER+SHIFT,Space,spawn,prism-ctl search toggle
bind=SUPER+ALT,w,spawn,prism-ctl wallpaper toggle
bind=SUPER+ALT,v,spawn,prism-ctl clipboard toggle
# Screen capture: overlay, whole screen at once, record (again = stop)
bind=NONE,Print,spawn,prism-ctl screenshot toggle
bind=SHIFT,Print,spawn,prism-ctl screenshot screen
bind=SUPER+SHIFT,r,spawn,prism-ctl screenshot record
bind=SUPER+ALT,e,spawn,prism-ctl emoji toggle
bind=SUPER+ALT,c,spawn,prism-ctl colorpicker toggle
bind=SUPER+ALT,n,spawn,prism-ctl notif toggle
bind=SUPER+ALT,comma,spawn,prism-ctl settings toggle
bind=SUPER+ALT,p,spawn,prism-ctl power toggle
bind=SUPER+ALT,slash,spawn,prism-ctl keybinds toggle
bind=SUPER+ALT,Delete,spawn,prism-ctl lock lock

# ── Media & Hardware OSD ─────────────────────────────────────────────────
bind=NONE,XF86AudioRaiseVolume,spawn,prism-ctl osd volume +5
bind=NONE,XF86AudioLowerVolume,spawn,prism-ctl osd volume -5
bind=NONE,XF86MonBrightnessUp,spawn,prism-ctl osd brightness +5
bind=NONE,XF86MonBrightnessDown,spawn,prism-ctl osd brightness -5
