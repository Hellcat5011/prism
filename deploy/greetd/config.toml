# greetd configuration for Prism Native Greeter

[terminal]
vt = 1

[default_session]
# 1. Cage kiosk (Recommended: WM-agnostic single-app Wayland kiosk, zero WM overhead):
command = "cage -s -- /usr/local/bin/prism-lock --greeter"

# 2. MangoWM:
# command = "mango --config /etc/greetd/mango-greet.conf"

# 3. Niri:
# command = "niri --config /etc/greetd/niri-greet.kdl"

user = "greeter"
