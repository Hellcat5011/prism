<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/toolbar.svg" alt="" class="logo">
    <h1>Prism Downloads</h1>
    <label class="switch" title="Turn Prism Downloads on or off">
      <input type="checkbox" id="enabled">
      <span class="track"><span class="knob"></span></span>
    </label>
  </header>

  <form id="add">
    <input id="url" type="url" placeholder="Paste a link to download" autocomplete="off" spellcheck="false">
    <button type="submit" title="Download with Prism">Download</button>
  </form>

  <div id="message" hidden></div>
  <section id="videos" hidden>
    <h2>Videos on this page</h2>
    <ul id="videoList"></ul>
  </section>
  <ul id="list"></ul>
  <p id="empty" hidden>No downloads yet. Downloads you start in Firefox appear here.</p>

  <footer>
    <button id="clear" class="link">Clear finished</button>
    <button id="options" class="link">Settings</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
