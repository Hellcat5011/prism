[workspace]
resolver = "2"
members = [
    "crates/prism-common",
    "crates/prism-capture",
    "crates/prism-ctl",
    "crates/prism-lock",
    "crates/prism-phone",
    "crates/prism-rec",
    "crates/prismd",
    "crates/prism-ui",
    "crates/prism-video",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
# Cross-crate inlining (prism-common into every binary) and one codegen unit: smaller, faster
# binaries for a longer build. Debug info is stripped; symbol names stay for panic backtraces.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
